name: Feature or new rule idea
description: Suggest a new check, output format, integration, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation — e.g. "Models keep calling my tool with dates in the wrong format and nothing catches it."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like mcp-reportcard to do?
      description: For a new rule, say what it should detect and what fix it should suggest.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example tool definition (optional)
      render: json
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd be happy to open a pull request for this.
