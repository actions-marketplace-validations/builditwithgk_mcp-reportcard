[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mcp-reportcard"
version = "0.1.0"
description = "A health check for MCP servers: lint tool descriptions and schemas, estimate token cost, fuzz error handling, and get a graded report card."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Gopi K Aitham (builditwithgk)" }]
keywords = ["mcp", "model-context-protocol", "llm", "ai-agents", "lint", "fuzzing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2.0",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
web = ["flask>=3.0"]
dev = ["pytest>=8", "tiktoken>=0.7", "flask>=3.0"]

[project.urls]
Homepage = "https://scaleup-solutions.in/"
Repository = "https://github.com/builditwithgk/mcp-reportcard"
Issues = "https://github.com/builditwithgk/mcp-reportcard/issues"

[project.scripts]
mcp-reportcard = "mcp_reportcard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_reportcard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
